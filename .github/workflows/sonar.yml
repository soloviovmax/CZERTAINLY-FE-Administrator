name: Sonar
on:
  workflow_dispatch:
    inputs:
      pr_number:   { description: "PR number", required: true }
      head_sha:    { description: "Head commit SHA", required: true }
      head_repo:   { description: "Fork repo full_name", required: true }
      head_branch: { description: "Fork branch", required: true }
      base_ref:    { description: "Base branch", required: true }

# What appears in the Actions list
run-name: >-
  Sonar • PR #${{ inputs.pr_number }}
  • ${{ inputs.head_repo }}@${{ inputs.head_branch }}
  • ${{ inputs.head_sha }}

permissions:
  actions: read # find the Playwright run of the commit and download its coverage
  contents: read
  checks: write
  pull-requests: read

jobs:
  sonar:
    name: Sonar • PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest

    steps:
      - name: Export context
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REPO: ${{ inputs.head_repo }}
          PR_BRANCH: ${{ inputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_ref }}
        run: |
          echo "PR_NUMBER=$PR_NUMBER"     >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA"       >> "$GITHUB_ENV"
          echo "HEAD_REPO=$HEAD_REPO"     >> "$GITHUB_ENV"
          echo "PR_BRANCH=$PR_BRANCH"     >> "$GITHUB_ENV"
          echo "BASE_BRANCH=$BASE_BRANCH" >> "$GITHUB_ENV"

      - name: Generate token
        id: app_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.SONAR_GH_APP_ID }}
          private_key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Create GitHub Check (in_progress)
        id: create_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `SonarQube Analysis`,
              head_sha: process.env.HEAD_SHA,
              status: "in_progress"
            });
            core.setOutput("check_id", check.data.id);

      # Checkout fork PR branch + fetch base to compute diff
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.PR_BRANCH }}
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git remote add upstream ${{ github.event.repository.clone_url }}
          git fetch upstream $BASE_BRANCH
          git checkout -B "$BASE_BRANCH" "upstream/$BASE_BRANCH"
          git checkout "$PR_BRANCH"
          git clean -ffdx && git reset --hard HEAD

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      # The component-test coverage comes from the Playwright Tests run of this commit, which the pull_request event
      # already started; running the suite here again would double its cost. Only a run that passed is taken.
      - name: Wait for the Playwright run of this commit
        id: playwright
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ env.HEAD_SHA }}
        run: |
          for _ in $(seq 1 90); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow playwright.yml --event pull_request --commit "$COMMIT" \
              --json databaseId,status,conclusion,createdAt --jq 'sort_by(.createdAt) | last')
            if [ -n "$run" ] && [ "$run" != "null" ]; then
              id=$(jq -r '.databaseId' <<<"$run")
              if [ "$(jq -r '.status' <<<"$run")" = "completed" ]; then
                conclusion=$(jq -r '.conclusion' <<<"$run")
                if [ "$conclusion" != "success" ]; then
                  echo "::error::Playwright run $id for $COMMIT concluded $conclusion, so there is no coverage to scan"
                  exit 1
                fi
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Playwright run $id is still $(jq -r '.status' <<<"$run")"
            else
              echo "No Playwright run for $COMMIT yet"
            fi
            sleep 30
          done
          echo "::error::Gave up waiting for the Playwright run of $COMMIT"
          exit 1

      - name: Download the component-test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-coverage-chromium
          path: coverage-playwright
          run-id: ${{ steps.playwright.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install + unit tests + coverage
        env:
          CI: true
        run: |
          npm ci --ignore-scripts
          npm run test:vitest:cov

          # Sanity check
          test -f coverage-playwright/lcov.info
          echo "Playwright LCOV downloaded: $(wc -l coverage-playwright/lcov.info | awk '{print $1}') lines"
          test -f coverage-vitest/lcov.info
          echo "Vitest LCOV generated: $(wc -l coverage-vitest/lcov.info | awk '{print $1}') lines"

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.scm.revision=${{ env.HEAD_SHA }}
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.PR_BRANCH }}
            -Dsonar.pullrequest.base=${{ env.BASE_BRANCH }}

      - name: Finalize GitHub Check
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const checkId = "${{ steps.create_check.outputs.check_id }}";
            const status = "${{ job.status }}";
            const conclusions = { success: "success", failure: "failure", cancelled: "cancelled" };
            const conclusion = conclusions[status] || "failure";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              completed_at: new Date().toISOString(),
              status: "completed",
              conclusion,
              output: {
                title: "SonarQube Analysis Result",
                summary: `✅ SonarQube analysis concluded with status: **${conclusion}**`,
              }
            });
