name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The suite is split by file across shards, and `test` below merges them. Sonar reads the merged coverage this
  # workflow publishes rather than running the suite a second time (see sonar.yml), so keep the artifact names.
  shard:
    name: shard (${{ matrix.browser }}, ${{ matrix.shard }}/4)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      # Keep all browser jobs running on main even if one fails
      fail-fast: false
      matrix:
        # PRs: chromium only (fast feedback). Push to main / manual dispatch: full matrix.
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox", "webkit"]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Browsers
        # Only install the browser needed for this job (faster)
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        # Run only the project matching this browser, and only this job's slice of the files
        run: npx playwright test -c playwright-ct.config.ts --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-shard-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            blob-report/
            coverage-playwright/raw/
          retention-days: 1
          if-no-files-found: error

  # Named like the single job it replaces, so the required status check keeps its name.
  test:
    name: test (${{ matrix.browser }})
    needs: shard
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox", "webkit"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-shard-${{ matrix.browser }}-*
          path: shards
      - name: Merge the shard reports
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-report/junit.xml
        run: |
          mkdir -p all-blob-reports
          cp shards/*/blob-report/*.zip all-blob-reports/
          npx playwright merge-reports --reporter html,junit all-blob-reports
      - name: Merge the shard coverage
        run: |
          node scripts/merge-ct-coverage.mjs shards/*/coverage-playwright/raw
          node scripts/clean-lcov.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Unique artifact name per browser to avoid conflicts
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-coverage-${{ matrix.browser }}
          path: coverage-playwright/lcov.info
          # Kept as long as the report, so a Sonar re-run of an older commit still finds it
          retention-days: 30
          if-no-files-found: error
      - name: Fail when a shard failed
        if: ${{ needs.shard.result != 'success' }}
        run: |
          echo "::error::A shard concluded ${{ needs.shard.result }}; see the merged report artifact"
          exit 1
